kind = "web"
previewPath = "/"
title = "Talent Graph"
description = "Talent Graph is a professional identity platform for athletes in sports. It provides verified profiles, structured performance data, role-based dashboards for athletes, coaches, scouts, analysts, and clubs, AI-powered scouting reports, team management, messaging, and long-term career tracking — all backed by Firebase."
version = "1.0.0"
id = "artifacts/talent-graph"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22621

[services.development]
run = "pnpm --filter @workspace/talent-graph run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talent-graph", "run", "build" ]
serve = "static"
publicDir = "artifacts/talent-graph/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22621"
BASE_PATH = "/"
