version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm install --workspace=Frontend --save-optional --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*