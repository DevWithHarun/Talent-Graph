<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#000000"/>
  <!-- Rising blue line representing athletic progress -->
  <polyline points="100,320 180,320 220,340 380,180 430,180" fill="none" stroke="#2563EB" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Runner figure in white -->
  <!-- Head -->
  <circle cx="340" cy="180" r="16" fill="#FFFFFF"/>
  <!-- Body/Torso and arms in running posture -->
  <path d="M 285 245 L 320 205 L 342 215 L 330 240 Z" fill="#FFFFFF"/>
  <!-- Front leg extending upward -->
  <path d="M 320 235 L 335 270 L 320 280 L 310 270 L 310 240 Z" fill="#FFFFFF"/>
  <!-- Back leg in propulsion stride -->
  <path d="M 290 240 L 265 270 L 260 265 L 280 235 Z" fill="#FFFFFF"/>
  <!-- Front arm forward -->
  <path d="M 335 210 L 350 200 L 355 210 L 340 218 Z" fill="#FFFFFF"/>
  <!-- Embedded crisp brand logo asset -->
  <image href="/icons/logo-transparent.png" x="32" y="32" width="448" height="448" preserveAspectRatio="xMidYMid meet"/>
</svg>
